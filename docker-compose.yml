services:
  dev:
    build:
      context: .
      target: development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - landing_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_USE_POLLING: "1"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"

  app:
    build:
      context: .
      target: production
    ports:
      - "8080:80"
    profiles:
      - prod

volumes:
  landing_node_modules:
